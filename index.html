<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reina's Birthday ♥ April 28th</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 25%, #ffcae5 50%, #ffb8dc 75%, #ffa5d2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Soft glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, rgba(255,182,193,0) 70%); top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,218,185,0.8) 0%, rgba(255,218,185,0) 70%); bottom: -50px; right: -50px; animation-delay: 5s; }
        .orb-3 { width: 250px; height: 250px; background: radial-gradient(circle, rgba(221,160,221,0.6) 0%, rgba(221,160,221,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Floating petals */
        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ffb7c5, #ffc0cb);
            border-radius: 0 50% 0 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 3rem;
            max-width: 1000px;
            width: 100%;
            position: relative;
        }

        .frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            pointer-events: none;
            box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.1), inset 0 0 100px rgba(255, 255, 255, 0.2);
        }

        .crown {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: gentle-bounce 3s ease-in-out infinite;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            background: linear-gradient(45deg, #d63384, #e83e8c, #f06595, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #8b4557;
            margin-bottom: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin: 3rem 0;
        }

        /* Birthday Mode - Toggle Visibility */
        .birthday-active .countdown { display: none; }
        .birthday-content { display: none; margin: 2rem 0; }
        .birthday-active .birthday-content { display: block; }

        .birthday-message {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #d63384;
            margin-bottom: 10px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        /* The Subtext Style */
        .birthday-subtext {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #8b4557;
            font-style: italic;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 2.5rem 2rem;
            min-width: 140px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(214, 51, 132, 0.15);
        }

        .number {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #d63384;
            display: block;
            font-weight: 600;
        }

        .label {
            font-size: 0.9rem;
            color: #8b4557;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .date-display {
            margin-top: 2rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #d63384;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.5);
            display: inline-block;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .message {
            margin-top: 3rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #8b4557;
            font-style: italic;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hearts-decoration { position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden; top: 0; left: 0; }
        .floating-heart { position: absolute; color: rgba(214, 51, 132, 0.2); animation: float-up 10s infinite ease-in; }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            .birthday-message { font-size: 2.8rem; }
            .birthday-subtext { font-size: 1.2rem; }
            .time-unit { min-width: 100px; padding: 1.5rem; }
            .number { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div id="petals-container"></div>
    <div class="hearts-decoration" id="hearts-container"></div>

    <div class="container" id="main-container">
        <div class="frame"></div>
        <div class="crown">👑</div>
        <h1>Mi Reina</h1>
        <div class="subtitle" id="dynamic-subtitle">Birthday Countdown</div>
        
        <!-- Countdown Section -->
        <div class="countdown" id="countdown">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <!-- Birthday Message Section -->
        <div class="birthday-content">
            <div class="birthday-message">Happy Birthday, My Queen!</div>
            <div class="birthday-subtext">"This is the first gift. Look out"</div>
        </div>

        <div class="date-display">April 28th</div>
        
        <div class="message" id="dynamic-message">
            "Every moment brings us closer to celebrating the queen who reigns supreme in my heart"
        </div>
    </div>

    <script>
        // Animations (Petals & Hearts)
        const petalsContainer = document.getElementById('petals-container');
        for (let i = 0; i < 25; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDelay = Math.random() * 10 + 's';
            petal.style.animationDuration = (8 + Math.random() * 10) + 's';
            petalsContainer.appendChild(petal);
        }

        const heartsContainer = document.getElementById('hearts-container');
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 10 + 's';
            heart.style.fontSize = (1 + Math.random() * 2) + 'rem';
            heartsContainer.appendChild(heart);
        }

        // Countdown Logic
        function updateUI() {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // Define D-Day (April 28) and the day it ends (April 29)
            const bdayStart = new Date(currentYear, 3, 28, 0, 0, 0);
            const bdayEnd = new Date(currentYear, 3, 29, 0, 0, 0);

            const container = document.getElementById('main-container');
            const subtitle = document.getElementById('dynamic-subtitle');
            const footerMessage = document.getElementById('dynamic-message');

            // 1. IS IT THE BIRTHDAY?
            if (now >= bdayStart && now < bdayEnd) {
                container.classList.add('birthday-active');
                subtitle.textContent = "Your Day Has Arrived";
                footerMessage.textContent = "I hope this day is as magnificent as you are.";
                return;
            }

            // 2. IS THE BIRTHDAY OVER? (Set target to next year if so)
            container.classList.remove('birthday-active');
            let targetYear = (now >= bdayEnd) ? currentYear + 1 : currentYear;
            const targetDate = new Date(targetYear, 3, 28, 0, 0, 0);
            
            const diff = targetDate - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            subtitle.textContent = "Birthday Countdown";
            footerMessage.textContent = `"Every moment brings us closer to celebrating the queen who reigns supreme in my heart"`;
        }

        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
